<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Formlet Sample Form</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      margin: 32px;
      max-width: 760px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 16px;
    }

    input,
    textarea,
    select {
      box-sizing: border-box;
      display: block;
      font: inherit;
      margin-top: 6px;
      padding: 8px;
      width: 100%;
    }

    input[type="checkbox"],
    input[type="radio"] {
      display: inline-block;
      margin-right: 6px;
      width: auto;
    }

    .inline-label {
      align-items: center;
      display: flex;
      gap: 6px;
      margin-top: 16px;
    }

    button {
      margin-top: 24px;
      padding: 8px 16px;
    }
  </style>
</head>
<body>
  <h1>Formlet Sample Form</h1>

  <form>
    <label for="mtlItemName">品目名</label>
    <input id="mtlItemName" class="x8" name="mtlItemName" type="text" maxlength="45" placeholder="全角">

    <label for="memo">備考</label>
    <textarea id="memo" class="memo" name="memo" rows="4" placeholder="作業メモ"></textarea>

    <label for="category">カテゴリ</label>
    <select id="category" name="category">
      <option value="">選択してください</option>
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="C">C</option>
    </select>

    <label class="inline-label">
      <input type="checkbox" name="confirmed">
      確認済み
    </label>

    <label class="inline-label">
      <input type="radio" name="priority" value="normal">
      通常
    </label>

    <label class="inline-label">
      <input type="radio" name="priority" value="urgent">
      至急
    </label>

    <input type="hidden" name="internalId" value="sample-hidden">
    <input type="password" name="password" placeholder="除外される項目">

    <button type="button">送信しないサンプルボタン</button>
  </form>
</body>
</html>
